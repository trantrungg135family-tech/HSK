<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>Classroom Feud</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bungee&display=swap">
<style>
/* Layout: TV-studio stage — marquee answer board centre-stage, team podiums on the wings, teacher console docked underneath */
:root{
  color-scheme: dark;
  --night:#060a22; --navy:#0b1446; --violet:#2a0f5c; --plum:#4a1580;
  --neon:#3cd3ff; --neon-2:#8be9ff; --gold:#ffc83d; --gold-2:#ffe79a; --gold-deep:#b9780c;
  --ink:#f1f4ff; --muted:#aab4e2; --dim:#6f7ab0;
  --panel:rgba(14,22,78,.74); --panel-2:rgba(24,34,104,.66); --field:rgba(4,8,30,.7); --line:rgba(130,155,255,.26);
  --red:#ff3d55; --green:#3ef0a0;
  --team-a:#3cd3ff; --a-rgb:60,211,255;
  --team-b:#ff63d4; --b-rgb:255,99,212;
  --f-display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --f-board:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --f-ui:'Be Vietnam Pro','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r-md:16px;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;font-family:var(--f-ui);font-size:16px;line-height:1.45;color:var(--ink);
  background-color:var(--night);
  background-image:radial-gradient(120% 80% at 50% -10%,rgba(80,40,170,.65) 0%,transparent 60%),radial-gradient(80% 70% at 100% 110%,rgba(110,30,160,.55) 0%,transparent 60%),linear-gradient(160deg,var(--navy) 0%,var(--night) 55%,#1b0a44 100%);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.72em;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:rgba(0,0,0,.28);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- studio lights ---------- */
.spots{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.beam{position:absolute;top:-18vh;width:44vmax;height:150vh;transform-origin:50% 0;clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);opacity:.55}
.beam.b1{left:-6vmax;background:linear-gradient(180deg,rgba(139,233,255,.20),rgba(139,233,255,0) 72%);animation:sway1 12s ease-in-out infinite alternate}
.beam.b2{right:-6vmax;background:linear-gradient(180deg,rgba(200,140,255,.20),rgba(200,140,255,0) 72%);animation:sway2 14s ease-in-out infinite alternate}
@keyframes sway1{from{transform:rotate(-26deg)}to{transform:rotate(8deg)}}
@keyframes sway2{from{transform:rotate(26deg)}to{transform:rotate(-8deg)}}
body[data-screen="setup"] .beam{opacity:.25}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(6,10,34,.92),rgba(6,10,34,.6))}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand-title{font-family:var(--f-display);font-size:clamp(15px,1.7vw,24px);color:var(--gold);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 14px rgba(255,200,61,.45)}
.tb-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.main{min-height:0;position:relative}
.screen{height:100%;min-height:0;position:relative}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s,background-color .2s,border-color .2s,box-shadow .2s;touch-action:manipulation;user-select:none;-webkit-user-select:none;text-decoration:none}
.btn:hover{border-color:rgba(139,233,255,.6);background:rgba(36,52,140,.8)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible,.icon-btn:focus-visible,.cbtn:focus-visible,.seg button:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[disabled],.cbtn[disabled],.icon-btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.btn-sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn-lg{min-height:52px;padding:10px 24px;font-size:18px}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold) 46%,#e09a14);color:#2a1600;border-color:#ffe08a;box-shadow:0 0 18px rgba(255,200,61,.35);font-weight:700}
.btn-gold:hover{background:linear-gradient(180deg,#fff0b8,#ffd25c 46%,#f0aa20);border-color:#fff0b8}
.btn-neon{border-color:rgba(60,211,255,.7);box-shadow:inset 0 0 14px rgba(60,211,255,.18),0 0 12px rgba(60,211,255,.18)}
.btn-danger{border-color:rgba(255,61,85,.7);background:rgba(140,12,36,.5);color:#ffe1e5}
.btn-danger:hover{background:rgba(170,20,46,.7);border-color:#ff8a98}
.btn-quiet{background:transparent}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(20,30,95,.55);color:var(--ink);cursor:pointer;transition:background-color .2s,border-color .2s}
.icon-btn:hover{background:rgba(36,52,140,.85);border-color:rgba(139,233,255,.6)}
.icon-btn.sm{width:38px;height:38px;border-radius:10px}
.icon-btn.danger:hover{border-color:#ff8a98;color:#ffd0d6;background:rgba(140,12,36,.5)}
.icon-btn.on{color:var(--gold);border-color:rgba(255,200,61,.6)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(20,30,95,.55)}
.seg button{border:0;background:transparent;padding:0 12px;min-height:42px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1600}
.link{border:0;background:none;padding:2px 0;color:var(--neon-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;text-align:left}
input[type=text],input[type=number],textarea,select{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font-size:16px;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;line-height:1.35}
select{cursor:pointer}
select option{background:#0b1140;color:var(--ink)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(60,211,255,.25)}
input::placeholder,textarea::placeholder{color:var(--dim)}
.invalid{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(255,61,85,.22)!important}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);cursor:pointer;flex:none;margin:0}
input[type=range]{width:100%;accent-color:var(--gold)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-rows:minmax(0,1fr) auto}
.setup-scroll{overflow:auto;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup-inner{max-width:1040px;margin:0 auto;display:grid;gap:20px}
.setup-head{display:grid;gap:6px}
.setup-head h1{margin:0;font-family:var(--f-display);font-size:clamp(24px,3vw,36px);font-weight:400;color:var(--ink);letter-spacing:.01em}
.lead{margin:0;color:var(--muted);max-width:62ch}
.sample-note{margin:4px 0 0;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.4);color:var(--gold-2);font-size:14px;justify-self:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.card h2,.rounds-head h2{margin:0 0 14px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon-2);font-weight:700}
.grid-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 18px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .help-line{font-size:13px;color:var(--dim)}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:500}
.gip{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;border-color:rgba(255,200,61,.55);background:linear-gradient(90deg,rgba(255,200,61,.14),var(--panel) 45%)}
.gip-text{flex:1;min-width:220px;display:grid;gap:2px}
.gip-text b{font-family:var(--f-display);font-weight:400;color:var(--gold);font-size:17px;letter-spacing:.02em}
.gip-text span{color:var(--muted);font-size:14px}
.warn{border-color:rgba(255,61,85,.6);background:rgba(90,10,30,.55);color:#ffe1e5;font-size:15px}
.rounds{display:grid;gap:16px}
.rounds-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.rounds-head h2{margin:0}
.hint{margin:0;color:var(--muted);font-size:14px}
.round-list{display:grid;gap:16px}
.round-card{display:grid;gap:14px}
.round-card.is-double{border-color:rgba(255,200,61,.65);box-shadow:0 0 0 1px rgba(255,200,61,.2),0 0 32px rgba(255,200,61,.12)}
.round-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.round-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--neon-2);letter-spacing:.02em}
.chip-x2{font-family:var(--f-display);font-size:13px;padding:4px 10px;border-radius:999px;color:#2a1600;background:linear-gradient(180deg,var(--gold-2),var(--gold));box-shadow:0 0 14px rgba(255,200,61,.45)}
.round-head .check-row{min-height:38px;font-size:14px;padding:0 10px;border-radius:10px;border:1px dashed rgba(255,200,61,.45);color:var(--gold-2)}
.round-tools{margin-left:auto;display:flex;gap:6px}
.ans-block{display:grid;gap:8px}
.ans-cols,.ans-row{display:grid;grid-template-columns:34px minmax(0,1fr) 96px 92px 38px;gap:8px;align-items:center}
.ans-cols{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.ans-cols span:first-child{text-align:center}
.ans-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;border-radius:10px}
.ans-list.invalid{padding:6px}
.ans-num{font-family:var(--f-display);color:var(--gold);text-align:center;font-size:16px}
.ans-row input[data-field=points]{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.x2calc{font-size:14px;color:var(--gold-2);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.round-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.round-total{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.round-total b{color:var(--ink)}
.add-round{justify-self:start}
.setup-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(6,10,34,.95),rgba(8,12,44,.85))}
.bar-left,.bar-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bar-left{flex:1;min-width:0}
.setup-bar .btn{white-space:nowrap}
@media (max-width:720px){
  .setup-bar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .bar-right{order:-1;flex-wrap:nowrap}
  .bar-right .btn{flex:1}
  .bar-left{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .bar-left::-webkit-scrollbar{display:none}
  .bar-left>*{flex:none}
  .setup-bar .btn-lg{font-size:16px;padding:8px 16px}
}
.save-status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:4px 4px}
.save-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.save-status.saving::before{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.save-status.fail{color:#ffc1ca}
.save-status.fail::before{background:var(--red);box-shadow:0 0 8px var(--red)}
@media (max-width:620px){
  .ans-cols{display:none}
  .ans-row{grid-template-columns:28px minmax(0,1fr) 76px 38px;row-gap:4px}
  .x2calc{grid-column:2 / 4;grid-row:2;font-size:13px}
  .x2calc:empty{display:none}
  .round-tools{margin-left:0}
}

/* ---------- game stage ---------- */
.game{display:grid;grid-template-rows:1fr auto auto;gap:clamp(6px,1.2vh,12px);padding-block:clamp(8px,1.4vh,16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;overflow-x:hidden}
.stage{display:grid;grid-template-columns:minmax(120px,15%) minmax(0,1fr) minmax(120px,15%);gap:clamp(10px,1.6vw,26px)}
.podium{--tc:var(--team-a);--tc-rgb:var(--a-rgb);position:relative;align-self:center;display:grid;justify-items:center;gap:clamp(4px,1vh,10px);padding:clamp(18px,2.6vh,30px) 10px clamp(12px,2vh,22px);border-radius:20px;background:linear-gradient(180deg,rgba(26,36,112,.85),rgba(8,12,44,.92));border:2px solid rgba(var(--tc-rgb),.35);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .3s,box-shadow .3s,border-color .3s;cursor:pointer}
.podium.team-b{--tc:var(--team-b);--tc-rgb:var(--b-rgb)}
.podium.active{border-color:var(--tc);box-shadow:0 0 0 1px rgba(var(--tc-rgb),.6),0 0 36px rgba(var(--tc-rgb),.55),0 10px 30px rgba(0,0,0,.35);transform:translateY(-4px)}
.team-name{font-family:var(--f-board);font-weight:800;font-size:clamp(17px,2vw,32px);line-height:1;text-transform:uppercase;color:var(--tc);text-align:center;overflow-wrap:anywhere;letter-spacing:.02em}
.score{font-family:var(--f-display);font-size:clamp(36px,5.2vw,92px);line-height:1;color:var(--gold);text-shadow:0 0 20px rgba(255,200,61,.55);font-variant-numeric:tabular-nums;transition:transform .2s}
.score.popped{animation:scorePop .5s ease}
@keyframes scorePop{40%{transform:scale(1.18)}}
.turn-tag{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--tc);color:#07102e;box-shadow:0 0 16px rgba(var(--tc-rgb),.8);opacity:0;transition:opacity .25s}
.podium.active .turn-tag{opacity:1}
.gain{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-display);font-size:clamp(20px,2.4vw,34px);color:var(--gold-2);text-shadow:0 0 14px rgba(255,200,61,.9);pointer-events:none;animation:gainUp 1.3s ease-out forwards;white-space:nowrap}
.gain.neg{color:#ffb3bf;text-shadow:0 0 14px rgba(255,61,85,.9)}
@keyframes gainUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.center{display:grid;grid-template-rows:auto 1fr auto;gap:clamp(6px,1.2vh,14px);min-width:0}
.q-banner{display:grid;justify-items:center;gap:clamp(4px,.8vh,10px);text-align:center}
.round-line{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.round-chip{font-family:var(--f-display);font-size:clamp(12px,1.15vw,16px);letter-spacing:.06em;color:var(--neon-2);padding:4px 12px;border-radius:999px;border:1px solid rgba(60,211,255,.5);background:rgba(4,8,30,.55)}
.x2badge{font-family:var(--f-display);font-size:clamp(13px,1.35vw,19px);color:#2a1600;padding:5px 14px;border-radius:999px;background:linear-gradient(100deg,#ffd25c 0%,#fff3c4 40%,#ffc83d 60%,#e8a017 100%);background-size:220% 100%;box-shadow:0 0 22px rgba(255,200,61,.7);animation:x2pulse 1.4s ease-in-out infinite,shine 2.4s linear infinite}
@keyframes x2pulse{0%,100%{transform:scale(1);box-shadow:0 0 14px rgba(255,200,61,.5)}50%{transform:scale(1.08);box-shadow:0 0 36px rgba(255,200,61,.95)}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.question{margin:0;font-family:var(--f-board);font-weight:700;font-size:clamp(22px,min(3.3vw,5.4vh),60px);line-height:1.08;max-width:34ch;text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 26px rgba(60,211,255,.35)}

/* marquee board */
.marquee{position:relative;min-height:max(190px,calc(var(--mrows,3) * 40px + 36px));display:grid;grid-template-rows:minmax(0,1fr);padding:clamp(14px,1.8vw,24px);border-radius:24px;background:linear-gradient(180deg,#1b2266,#0a0e38);border:3px solid #c88a1c;box-shadow:inset 0 0 0 2px rgba(255,214,110,.55),inset 0 0 40px rgba(0,0,0,.6),0 0 40px rgba(255,200,61,.18),0 0 90px rgba(60,211,255,.12)}
.marquee.is-double{border-color:var(--gold);box-shadow:inset 0 0 0 2px rgba(255,236,170,.8),inset 0 0 40px rgba(0,0,0,.5),0 0 50px rgba(255,200,61,.45),0 0 110px rgba(255,200,61,.2)}
.bulbs{position:absolute;pointer-events:none;--b:#fff3c4;--g:#ffc83d}
.bulbs.top,.bulbs.bottom{left:22px;right:22px;height:12px;background:radial-gradient(circle,var(--b) 0 2.2px,var(--g) 3.2px,rgba(255,200,61,0) 5.5px) 0 50%/36px 12px repeat-x,radial-gradient(circle,#8a5a12 0 2.6px,rgba(0,0,0,0) 3.4px) 18px 50%/36px 12px repeat-x;animation:chaseX 1s steps(1) infinite}
.bulbs.top{top:1px}.bulbs.bottom{bottom:1px;animation-delay:-.5s}
.bulbs.left,.bulbs.right{top:22px;bottom:22px;width:12px;background:radial-gradient(circle,var(--b) 0 2.2px,var(--g) 3.2px,rgba(255,200,61,0) 5.5px) 50% 0/12px 36px repeat-y,radial-gradient(circle,#8a5a12 0 2.6px,rgba(0,0,0,0) 3.4px) 50% 18px/12px 36px repeat-y;animation:chaseY 1s steps(1) infinite}
.bulbs.left{left:1px;animation-delay:-.5s}.bulbs.right{right:1px}
.marquee.is-double .bulbs{animation-duration:.5s}
@keyframes chaseX{0%{background-position:0 50%,18px 50%}50%{background-position:18px 50%,0 50%}}
@keyframes chaseY{0%{background-position:50% 0,50% 18px}50%{background-position:50% 18px,50% 0}}
.board{container-type:size;min-height:0;min-width:0;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));grid-template-rows:repeat(var(--rows,3),minmax(0,1fr));grid-auto-flow:column;gap:clamp(6px,1.1vmin,12px)}
.tile{position:relative;display:block;min-width:0;min-height:0;padding:0;border:0;background:none;cursor:pointer;perspective:1000px;border-radius:12px;text-align:left;color:var(--ink)}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tile-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.25,.9,.3,1.15);transition-delay:var(--d,0ms)}
.tile.revealed .tile-inner{transform:rotateX(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;overflow:hidden;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{justify-content:center;background:linear-gradient(180deg,#3f7bff 0%,#2448d8 47%,#1631a8 53%,#1e40c6 100%);border:2px solid rgba(139,233,255,.7);box-shadow:inset 0 0 20px rgba(139,233,255,.45),0 0 14px rgba(60,211,255,.25);transition:filter .2s}
.tile:not(.revealed):hover .front{filter:brightness(1.18)}
.tnum{display:grid;place-items:center;height:72%;max-height:110px;aspect-ratio:1.75;border-radius:50%;background:radial-gradient(circle at 50% 35%,#24307e,#0b1150 70%);border:3px solid var(--gold);box-shadow:0 0 12px rgba(255,200,61,.6),inset 0 0 10px rgba(0,0,0,.6);font-family:var(--f-display);color:#fff;font-size:clamp(14px,calc(100cqh / var(--rows) * .4),52px);line-height:1}
.back{transform:rotateX(180deg);background:linear-gradient(180deg,#1d2b8c 0%,#121c6a 50%,#0c1352 100%);border:2px solid rgba(255,214,110,.85);box-shadow:inset 0 0 22px rgba(255,200,61,.18)}
.back::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--strip,transparent)}
.tile.by-a{--strip:var(--team-a)}.tile.by-b{--strip:var(--team-b)}.tile.by-none{--strip:rgba(170,180,226,.35)}
.ans-text{flex:1;min-width:0;padding:0 .4em 0 .85em;font-family:var(--f-board);font-weight:800;text-transform:uppercase;line-height:1.02;letter-spacing:.01em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);font-size:clamp(13px,min(calc(100cqh / var(--rows) * .34),calc(100cqw / var(--cols) * .072)),50px);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pts{position:relative;align-self:stretch;flex:none;display:grid;place-content:center;justify-items:center;min-width:22%;padding:0 .55em;background:linear-gradient(180deg,var(--gold-2),var(--gold) 50%,#d99415);color:#2a1600;font-family:var(--f-display);font-size:clamp(14px,calc(100cqh / var(--rows) * .38),48px);line-height:1;font-variant-numeric:tabular-nums}
.pts small{font-family:var(--f-board);font-weight:800;font-size:.42em;letter-spacing:.03em;margin-top:.18em;opacity:.85;white-space:nowrap}
.tile.blank{cursor:default}
.tile.blank .front{background:linear-gradient(180deg,#141d5e,#0b1145);border-color:rgba(139,233,255,.18);box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
.tile.bump .tile-inner{animation:bump .35s ease}
@keyframes bump{30%{transform:rotateX(180deg) scale(1.04)}}
.stamp{position:absolute;right:24%;top:50%;transform:translate(0,-50%) scale(0);font-family:var(--f-display);color:var(--gold);font-size:clamp(16px,calc(100cqh / var(--rows) * .45),56px);text-shadow:0 0 18px rgba(255,200,61,1),0 2px 0 #5a3500;pointer-events:none;opacity:0}
.tile.x2flash .stamp{animation:stamp 1.5s .45s ease-out both}
.tile.x2flash .back::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,240,180,.75) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 1s .5s ease-out forwards}
@keyframes stamp{0%{opacity:0;transform:translate(0,-50%) scale(2.6) rotate(-12deg)}25%{opacity:1;transform:translate(0,-50%) scale(1) rotate(-6deg)}80%{opacity:1}100%{opacity:0;transform:translate(0,-50%) scale(1.1) rotate(-6deg)}}
@keyframes sweep{to{transform:translateX(120%)}}

/* status row */
.status-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;min-height:46px}
.round-note{margin:0;justify-self:start;font-weight:600;font-size:clamp(14px,1.4vw,20px);color:var(--gold-2);text-shadow:0 0 12px rgba(255,200,61,.35)}
.strikes{display:flex;gap:10px;justify-self:center}
.strike-slot{display:grid;place-items:center;width:clamp(36px,4.4vmin,56px);aspect-ratio:1;border-radius:10px;border:2px solid rgba(255,61,85,.35);background:rgba(50,0,14,.4);font-family:var(--f-display);font-size:clamp(18px,2.6vmin,32px);color:rgba(255,61,85,.25);transition:all .25s}
.strike-slot.on{color:#fff;background:radial-gradient(circle,#ff6577,#b0001b);border-color:#ff9aa6;box-shadow:0 0 20px rgba(255,61,85,.75)}
.timer{justify-self:end;position:relative;width:clamp(48px,6vmin,70px);aspect-ratio:1;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .trk{fill:rgba(4,8,30,.7);stroke:rgba(139,233,255,.2);stroke-width:4}
.timer .arc{fill:none;stroke:var(--neon);stroke-width:4;stroke-linecap:round;transition:stroke .3s}
.timer.low .arc{stroke:var(--red)}
.timer span{position:relative;font-family:var(--f-display);font-size:clamp(16px,2.4vmin,26px);font-variant-numeric:tabular-nums}
.timer.low span{color:#ffb3bf}
.timer.done{animation:timerDone .5s ease 3}
@keyframes timerDone{50%{transform:scale(1.2)}}

/* steal */
.steal{--tc:var(--team-b);--tc-rgb:var(--b-rgb);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 22px;padding:12px 18px;border-radius:18px;border:2px solid var(--tc);background:linear-gradient(90deg,rgba(var(--tc-rgb),.22),rgba(10,14,52,.94) 28%,rgba(10,14,52,.94) 72%,rgba(var(--tc-rgb),.22));box-shadow:0 0 32px rgba(var(--tc-rgb),.45);animation:stealIn .45s cubic-bezier(.2,1.3,.4,1)}
.steal.team-a{--tc:var(--team-a);--tc-rgb:var(--a-rgb)}
@keyframes stealIn{from{transform:translateY(16px) scale(.96);opacity:0}}
.steal-main{display:grid;gap:2px;min-width:0;max-width:46ch}
.steal-title{font-family:var(--f-display);font-size:clamp(20px,2.6vw,36px);color:var(--tc);line-height:1.05;text-shadow:0 0 18px rgba(var(--tc-rgb),.8);animation:flicker 1.2s ease-in-out infinite}
@keyframes flicker{50%{opacity:.72}}
.steal-who{font-weight:700;font-size:clamp(15px,1.5vw,20px);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.steal-how{margin:0;color:var(--muted);font-size:13px;line-height:1.35}
.steal-btns .btn{min-height:48px;padding:8px 18px;font-size:16px}
.steal-worth{font-family:var(--f-display);color:var(--gold);font-size:clamp(16px,1.8vw,24px);text-align:center;line-height:1.1}
.steal-worth small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--gold-2);letter-spacing:.04em}
.steal-side{display:grid;gap:8px;justify-items:center}
.steal-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn-ok{border-color:rgba(62,240,160,.75);background:rgba(10,90,60,.55);color:#dfffee}
.btn-ok:hover{background:rgba(14,120,80,.75);border-color:#8ff7c8}

/* console */
.console-wrap{position:relative}
.console{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 22px;padding:8px;border-radius:18px;background:rgba(6,10,34,.78);border:1px solid var(--line)}
.c-group{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cbtn{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(36,50,146,.85),rgba(16,24,82,.92));color:var(--ink);font-weight:700;font-size:15px;line-height:1.1;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:background-color .2s,border-color .2s,box-shadow .2s,transform .1s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cbtn:hover{border-color:rgba(139,233,255,.65)}
.cbtn:active{transform:translateY(1px) scale(.98)}
.cbtn .two{display:grid;text-align:left}
.cbtn small{font-size:11px;font-weight:500;color:var(--muted)}
.cbtn.team{--tc:var(--team-a);--tc-rgb:var(--a-rgb);border-color:rgba(var(--tc-rgb),.55);max-width:220px}
.cbtn.team.team-b{--tc:var(--team-b);--tc-rgb:var(--b-rgb)}
.cbtn.team .dot{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none;box-shadow:0 0 8px var(--tc)}
.cbtn.team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cbtn.team[aria-pressed="true"]{background:linear-gradient(180deg,rgba(var(--tc-rgb),.42),rgba(var(--tc-rgb),.16));border-color:var(--tc);box-shadow:0 0 18px rgba(var(--tc-rgb),.5)}
.cbtn.strike{border-color:rgba(255,61,85,.65)}
.cbtn.strike svg{color:#ff7b8c}
.cbtn.next{background:linear-gradient(180deg,var(--gold-2),var(--gold) 46%,#e09a14);color:#2a1600;border-color:#ffe08a;box-shadow:0 0 16px rgba(255,200,61,.35)}
.cbtn.next kbd{color:#5a3a00;border-color:rgba(90,58,0,.35);background:rgba(255,255,255,.3)}
.cbtn.icon-only{padding:6px 12px}
.cbtn[aria-expanded="true"]{border-color:var(--gold);box-shadow:0 0 14px rgba(255,200,61,.4)}
.show-controls{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.55;z-index:5}
.show-controls:hover,.show-controls:focus-visible{opacity:1}
.game.clean .console-wrap{display:none}

/* popovers */
.pop{z-index:65;width:min(360px,calc(100vw - 32px));padding:16px;border-radius:18px;background:linear-gradient(180deg,#18216a,#0c1246);border:1px solid rgba(139,233,255,.35);box-shadow:0 24px 60px rgba(0,0,0,.6);display:grid;gap:12px}
.pop h3{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon-2)}
.pop-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sound-pop{position:fixed;top:64px;right:max(16px,env(safe-area-inset-right,0px))}
.points-pop{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 32px))}
.pts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pts-grid .btn{min-width:0}
.pts-grid .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-calc{margin:0;font-weight:600;color:var(--gold-2);font-variant-numeric:tabular-nums}
.mp-err{margin:0;color:#ffb3bf;font-size:14px}
.range-row{display:grid;gap:4px}
.range-row .lbl{display:flex;justify-content:space-between}
.sound-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sound-seg .btn[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,200,61,.18);color:var(--gold-2)}
.note{margin:0;font-size:13px;color:var(--muted)}

/* ---------- results ---------- */
.results{overflow:auto;padding-block:clamp(16px,4vh,48px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.res-inner{max-width:920px;margin:0 auto;display:grid;justify-items:center;gap:clamp(12px,2.4vh,24px);text-align:center}
.res-eyebrow{margin:0;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--neon-2);font-size:clamp(13px,1.4vw,18px)}
.res-winner{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,8vw,128px);line-height:1;color:var(--gold);overflow-wrap:anywhere;text-shadow:0 0 30px rgba(255,200,61,.65),0 4px 0 #6a4300;animation:winIn 1.1s cubic-bezier(.2,1.4,.4,1) both}
.res-wins{margin:0;font-family:var(--f-display);font-size:clamp(22px,3.4vw,46px);color:var(--ink);animation:winIn 1.1s .25s cubic-bezier(.2,1.4,.4,1) both}
@keyframes winIn{0%{opacity:0;transform:scale(.4) rotate(-4deg)}100%{opacity:1;transform:none}}
.res-scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2vw,22px);width:100%}
.fs-card{--tc:var(--team-a);--tc-rgb:var(--a-rgb);display:grid;gap:6px;justify-items:center;padding:clamp(14px,2.4vh,26px) 12px;border-radius:20px;background:linear-gradient(180deg,rgba(26,36,112,.85),rgba(8,12,44,.92));border:2px solid rgba(var(--tc-rgb),.45)}
.fs-card.team-b{--tc:var(--team-b);--tc-rgb:var(--b-rgb)}
.fs-card.win{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,200,61,.5),0 0 40px rgba(255,200,61,.35)}
.fs-card .team-name{font-size:clamp(18px,2.4vw,34px)}
.fs-card .score{font-size:clamp(40px,6vw,96px)}
.crown{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#2a1600;background:var(--gold);padding:3px 10px;border-radius:999px}
.res-break{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.res-break summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--neon-2);letter-spacing:.06em}
.table-wrap{overflow-x:auto;padding-bottom:10px}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:700;color:var(--gold-2);border-bottom:0}
.res-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

/* ---------- overlays ---------- */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:10px;pointer-events:none;text-align:center;padding:16px;background:radial-gradient(circle at center,rgba(6,10,34,.8) 0%,rgba(6,10,34,0) 68%);animation:splash 1.9s ease both}
@keyframes splash{0%{opacity:0;transform:scale(1.25)}14%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.96)}}
.sp-round{font-family:var(--f-display);font-size:clamp(44px,9vw,140px);line-height:1;color:var(--neon-2);text-shadow:0 0 30px rgba(60,211,255,.85),0 4px 0 #0a2a6e}
.sp-x2{font-family:var(--f-display);font-size:clamp(26px,5.6vw,86px);line-height:1.05;color:var(--gold);text-shadow:0 0 30px rgba(255,200,61,.95),0 4px 0 #6a4300;animation:x2pulse 0.7s ease-in-out infinite}
.strike-fx{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;gap:2.5vw;pointer-events:none}
.bigx{font-family:var(--f-display);font-size:min(26vw,42vh);line-height:1;color:#ff2e48;text-shadow:0 0 30px rgba(255,46,72,.95),0 0 90px rgba(255,46,72,.6);animation:xslam 1.15s cubic-bezier(.2,1.4,.4,1) both}
@keyframes xslam{0%{opacity:0;transform:scale(2.3)}16%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0;transform:scale(.95)}}
.timeup{position:fixed;inset:0;z-index:55;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:clamp(40px,9vw,130px);color:#ff4a62;text-shadow:0 0 30px rgba(255,46,72,.9);animation:xslam 1.6s ease both}
.countdown{position:fixed;inset:0;z-index:58;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(circle,rgba(20,14,70,.9),rgba(4,6,24,.95));cursor:pointer;text-align:center;padding:16px}
.cd-num{font-family:var(--f-display);font-size:clamp(90px,24vw,300px);line-height:1;color:var(--gold);text-shadow:0 0 40px rgba(255,200,61,.9),0 6px 0 #6a4300}
.cd-num.go{color:var(--neon-2);text-shadow:0 0 40px rgba(60,211,255,.9),0 6px 0 #0a2a6e}
.cd-num.anim{animation:cdPop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes cdPop{0%{transform:scale(2);opacity:0}30%{transform:scale(1);opacity:1}}
.cd-skip{color:var(--muted);font-size:14px}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;max-width:min(560px,calc(100vw - 32px));padding:10px 18px;border-radius:14px;background:rgba(10,16,60,.96);border:1px solid rgba(139,233,255,.45);box-shadow:0 12px 30px rgba(0,0,0,.5);font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,61,85,.7)}
body[data-screen="setup"] .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* modal */
.modal-root{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(3,5,20,.72)}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:linear-gradient(180deg,#161f66,#0b1142);border:1px solid rgba(139,233,255,.35);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.65);animation:modalIn .22s ease}
.modal.wide{width:min(1100px,100%)}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{flex:1;margin:0;font-size:18px;font-weight:700}
.modal-body{padding:16px 20px;overflow:auto;min-height:0;display:grid;gap:14px;align-content:start}
.modal-body p{margin:0}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.modal-foot:empty{display:none}
.muted{color:var(--muted)}
.err-list{margin:0;padding-left:20px;display:grid;gap:8px}
.err-list .link{color:#ffc1ca}
.code-box{width:100%;min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.4;white-space:pre}
.set-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.set-item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(4,8,30,.45)}
.set-item .si-name{flex:1;min-width:160px;display:grid}
.set-item .si-name b{overflow-wrap:anywhere}
.set-item .si-name span{font-size:13px;color:var(--muted)}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.inline-form .field{flex:1;min-width:200px}
.pv-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.pv-q{margin:0;font-family:var(--f-board);font-weight:700;font-size:clamp(20px,2.6vw,34px);line-height:1.1;text-align:center}
.pv-stage{padding:14px;border-radius:20px}
.pv-stage .board{height:min(48vh,440px)}
.pv-nav{display:flex;align-items:center;justify-content:center;gap:12px;font-variant-numeric:tabular-nums}
.help{display:grid;gap:16px;max-width:70ch}
.help h3{margin:0 0 6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon-2)}
.help p,.help ol{margin:0}
.help ol{padding-left:22px;display:grid;gap:6px}
.keys{border-collapse:collapse;width:100%}
.keys td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.keys td:first-child{white-space:nowrap;width:1%}
.store-line{padding:10px 12px;border-radius:12px;background:rgba(62,240,160,.1);border:1px solid rgba(62,240,160,.35)}
.store-line.bad{background:rgba(255,61,85,.12);border-color:rgba(255,61,85,.45)}

/* ---------- classes & question library ---------- */
.cls-card{display:grid;gap:14px}
.cls-card h2{margin:0}
.cls-top{display:flex;flex-wrap:wrap;align-items:end;gap:10px 12px}
.cls-top .field{flex:1;min-width:200px;max-width:360px}
.cls-tools{display:flex;flex-wrap:wrap;gap:8px}
.cls-sets{max-height:420px;overflow:auto;padding-right:2px}
.lvl-chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid rgba(60,211,255,.5);color:var(--neon-2);background:rgba(4,8,30,.5);white-space:nowrap}
.lvl-chip.starters{border-color:rgba(62,240,160,.6);color:#a9f8d2}
.lvl-chip.flyers{border-color:rgba(255,99,212,.6);color:#ffc2ee}
.lvl-chip.ket{border-color:rgba(255,166,77,.65);color:#ffd9b0}
.set-item.unplayed{border-color:rgba(255,200,61,.6);background:linear-gradient(90deg,rgba(255,200,61,.13),rgba(4,8,30,.45) 55%)}
.set-item.current{border-color:rgba(62,240,160,.7);box-shadow:0 0 0 1px rgba(62,240,160,.3)}
.np-badge,.cur-badge{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;vertical-align:1px;white-space:nowrap}
.np-badge{background:var(--gold);color:#2a1600}

.xl-status{margin:0;color:var(--neon-2);font-size:14px}
.gs-status{margin:0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.gs-status.busy{color:var(--neon-2)}

};

const HELP = {
en: () => `
<section><h3>Before class</h3><p>Type a question for each round and give every answer a point value — bigger numbers for more popular answers. The last two rounds score ×2 automatically; you can change the multiplier or pick the rounds under Game details. Press <b>Preview</b> to check the board, then <b>Start game</b>.</p></section>
<section><h3>Playing a round</h3><ol>
<li>Choose the answering team with the team buttons, the podiums, or keys <kbd>A</kbd> / <kbd>B</kbd>. The answering team’s podium glows.</li>
<li>When a student gives a correct answer, click its tile or press its number. The points go to the answering team. A tile scores only once.</li>
<li>Wrong answer? Press <b>Strike</b> (<kbd>X</kbd>). After three strikes the other team gets one guess to steal.</li>
<li>If the steal works, that team wins the points of every answer still hidden. If it fails, nobody gets them.</li>
<li><b>Reveal</b> shows the next hidden answer without giving points — use it to show the rest of the board.</li>
<li>Turns never change on their own. Press <b>Next round</b> when you are ready.</li></ol></section>
<section><h3>Bonus rounds</h3><p>In a bonus round every point is multiplied once: answers, steals and points you add by hand. A tile worth 25 shows <b>50</b> with “25 × 2” under it.</p></section>
<section><h3>Fixing mistakes</h3><p><b>Undo</b> reverses the last action — a reveal, strike, steal, turn change, point change or round change. <b>Reset round</b> hides every answer and removes that round’s points. <b>Points</b> adds or removes points by hand. <b>Timer</b> starts a countdown for the answering team.</p></section>
<section><h3>Keyboard shortcuts</h3>${keysTable([['1 – 9, 0','Open answer 1–10 (scores for the answering team)'],['A / B','Choose the answering team'],['X','Strike'],['R','Reveal the next answer (no points)'],['T','Start or stop the timer'],['U · Ctrl+Z','Undo'],['N','Next round'],['H','Hide or show the controls'],['F','Fullscreen'],['M','Mute or unmute'],['?','Open this guide'],['Esc','Close a window']])}<p class="muted">Shortcuts are paused while you type in a box.</p></section>
<section><h3>Classes and the question library</h3><ol>
<li>Review the Excel question file: put <b>Y</b> (or X, ✓, OK, Có, Duyệt) in the <b>Approved</b> column of every question you want. Empty = not approved.</li>
<li>Press <b>Import Excel</b>. Only approved rows are imported. Each topic on the Starters, Movers, Flyers and KET sheets becomes one set in the <b>Question library</b>. Importing the same level and topic again updates that set.</li>
<li>Press <b>Classes</b> to add your classes, each with a level (for example 1A · Starters, 2A · Movers).</li>
<li>Choose a class under <b>Class &amp; question library</b>. You see the sets for its level, how often this class played each one, and the sets it has never played (highlighted). Press <b>Use this set</b>, then <b>Preview</b> or <b>Start game</b>. Starting the game records it in the class history.</li></ol>
<p>Use <b>Back up library</b> in the Question library to keep a copy of every set and class, and <b>Restore backup</b> to load it on another computer.</p></section>
<section><h3>Question bank (Google Sheet)</h3><ol>
<li>The question bank is a Google Sheet with one tab per level: <b>Starters</b>, <b>Movers</b>, <b>Flyers</b> and <b>KET</b>. Each set (for example <i>Movers 3</i>) has about 5 questions on different topics; one row = one round.</li>
<li>Read the questions in the sheet and put <b>Y</b> in the <b>Approved</b> column of every question you want to use. Empty or N = not approved, so the game ignores it.</li>
<li>In Game setup, under <b>Question bank (Google Sheet)</b>, choose the level (it follows the class you chose), then press <b>Use this set</b> on a set. Its questions go into the editor and the title becomes the set name; team names, multiplier and timer stay the same. Press <b>Preview</b> or <b>Start game</b>. Starting records the set in the class history, and sets this class hasn’t played are highlighted.</li>
<li>After changing the sheet, press <b>Refresh</b>. The game keeps the last copy it loaded, so it still works without internet (it shows when that copy is from).</li></ol>
<p>The sheet must be shared as “Anyone with the link”. To use a different sheet, press <b>Sheet link</b> and paste its link. The game only reads the sheet; it never changes it.</p></section>
<section><h3>Saving and sharing</h3><p>Questions, saved sets and the current game save automatically in this browser on this device. They don’t follow you to another computer, a private window, or a browser whose data was cleared. Anyone you share the link with sees the sample questions, not yours. To move or share a set, use <b>Export</b>, send the file, and load it with <b>Import</b>.</p>${storeLine()}</section>`,
vi: () => `
<section><h3>Trước giờ học</h3><p>Nhập câu hỏi cho mỗi vòng và cho điểm từng đáp án — đáp án càng phổ biến điểm càng cao. Hai vòng cuối tự động nhân ×2; bạn có thể đổi hệ số hoặc tự chọn vòng trong mục Thông tin trò chơi. Bấm <b>Xem trước</b> để kiểm tra bảng, rồi bấm <b>Bắt đầu</b>.</p></section>
<section><h3>Khi chơi một vòng</h3><ol>
<li>Chọn đội trả lời bằng nút tên đội, bấm vào bục điểm, hoặc phím <kbd>A</kbd> / <kbd>B</kbd>. Bục của đội đang trả lời sẽ sáng lên.</li>
<li>Khi học sinh nói đúng một đáp án, bấm vào ô đó hoặc bấm phím số tương ứng. Điểm được cộng cho đội đang trả lời. Mỗi ô chỉ tính điểm một lần.</li>
<li>Trả lời sai? Bấm <b>Sai</b> (<kbd>X</kbd>). Sau ba lần sai, đội còn lại có một lần đoán để cướp điểm.</li>
<li>Nếu cướp thành công, đội đó nhận điểm của mọi đáp án còn ẩn. Nếu thất bại, không đội nào nhận.</li>
<li><b>Mở đáp án</b> mở đáp án ẩn tiếp theo mà không tính điểm — dùng để cho cả lớp xem phần còn lại.</li>
<li>Lượt chơi không tự đổi. Bấm <b>Vòng tiếp</b> khi bạn sẵn sàng.</li></ol></section>
<section><h3>Vòng nhân điểm</h3><p>Trong vòng nhân điểm, mọi điểm chỉ được nhân một lần: đáp án, cướp điểm và điểm cộng tay. Ô 25 điểm sẽ hiện <b>50</b> kèm dòng “25 × 2”.</p></section>
<section><h3>Sửa nhầm lẫn</h3><p><b>Hoàn tác</b> đảo ngược thao tác vừa rồi — mở ô, sai, cướp điểm, đổi lượt, cộng/trừ điểm hoặc chuyển vòng. <b>Chơi lại vòng</b> ẩn lại mọi đáp án và bỏ điểm của vòng đó. <b>Điểm</b> cho phép cộng/trừ điểm bằng tay. <b>Đếm giờ</b> bật đồng hồ cho đội đang trả lời.</p></section>
<section><h3>Phím tắt</h3>${keysTable([['1 – 9, 0','Mở đáp án 1–10 (cộng điểm cho đội đang trả lời)'],['A / B','Chọn đội trả lời'],['X','Đánh dấu sai'],['R','Mở đáp án tiếp theo (không tính điểm)'],['T','Bật/tắt đồng hồ'],['U · Ctrl+Z','Hoàn tác'],['N','Vòng tiếp'],['H','Ẩn/hiện bảng điều khiển'],['F','Toàn màn hình'],['M','Tắt/bật tiếng'],['?','Mở hướng dẫn này'],['Esc','Đóng cửa sổ']])}<p class="muted">Phím tắt tạm dừng khi bạn đang gõ trong ô nhập.</p></section>
<section><h3>Lớp học và thư viện câu hỏi</h3><ol>
<li>Duyệt file Excel câu hỏi: ghi <b>Y</b> (hoặc X, ✓, OK, Có, Duyệt) vào cột <b>Approved</b> của mỗi câu muốn dùng. Để trống = chưa duyệt.</li>
<li>Bấm <b>Nhập Excel</b>. Chỉ các dòng đã duyệt được nhập. Mỗi chủ đề trên sheet Starters, Movers, Flyers, KET thành một bộ trong <b>Thư viện câu hỏi</b>. Nhập lại cùng cấp độ và chủ đề sẽ cập nhật bộ đó.</li>
<li>Bấm <b>Quản lý lớp</b> để thêm các lớp, mỗi lớp một cấp độ (ví dụ 1A · Starters, 2A · Movers).</li>
<li>Chọn lớp ở mục <b>Lớp học &amp; thư viện câu hỏi</b>. Bạn sẽ thấy các bộ của cấp độ đó, số lần lớp đã chơi từng bộ, và các bộ lớp chưa chơi (được tô sáng). Bấm <b>Dùng bộ này</b>, rồi <b>Xem trước</b> hoặc <b>Bắt đầu</b>. Khi bắt đầu, lượt chơi được ghi vào lịch sử của lớp.</li></ol>
<p>Trong Thư viện câu hỏi, bấm <b>Sao lưu thư viện</b> để giữ bản sao mọi bộ câu hỏi và lớp học, và <b>Khôi phục bản sao lưu</b> để mở trên máy khác.</p></section>
<section><h3>Ngân hàng câu hỏi (Google Sheet)</h3><ol>
<li>Ngân hàng câu hỏi là một Google Sheet, mỗi cấp độ một tab: <b>Starters</b>, <b>Movers</b>, <b>Flyers</b> và <b>KET</b>. Mỗi bộ (ví dụ <i>Movers 3</i>) có khoảng 5 câu thuộc các chủ đề khác nhau; mỗi dòng là một vòng chơi.</li>
<li>Đọc câu hỏi trong sheet và ghi <b>Y</b> vào cột <b>Approved</b> của mỗi câu muốn dùng. Để trống hoặc N = chưa duyệt, game sẽ bỏ qua.</li>
<li>Trên màn hình Thiết lập, ở mục <b>Ngân hàng câu hỏi (Google Sheet)</b>, chọn cấp độ (tự theo lớp đã chọn), rồi bấm <b>Dùng bộ này</b> ở một bộ. Câu hỏi được nạp vào phần soạn, tên trò chơi = tên bộ; tên đội, hệ số nhân và thời gian giữ nguyên. Bấm <b>Xem trước</b> hoặc <b>Bắt đầu</b>. Khi bắt đầu, bộ được ghi vào lịch sử của lớp; các bộ lớp chưa chơi được tô vàng.</li>
<li>Sau khi sửa sheet, bấm <b>Tải lại</b>. Game giữ bản tải gần nhất nên vẫn dùng được khi mất mạng (có ghi dữ liệu lúc nào).</li></ol>
<p>Sheet phải chia sẻ “Bất kỳ ai có đường liên kết”. Muốn dùng sheet khác, bấm <b>Link Google Sheet</b> và dán link. Game chỉ đọc sheet, không bao giờ sửa sheet.</p></section>
<section><h3>Lưu và chia sẻ</h3><p>Câu hỏi, các bộ đã lưu và trò chơi hiện tại được tự động lưu trên trình duyệt của máy này. Dữ liệu không đi theo bạn sang máy khác, cửa sổ ẩn danh, hoặc trình duyệt đã xóa dữ liệu. Người mở đường link bạn chia sẻ sẽ thấy câu hỏi mẫu, không phải câu hỏi của bạn. Để chuyển hoặc chia sẻ bộ câu hỏi, bấm <b>Xuất file</b>, gửi file đó, rồi mở bằng <b>Nhập file</b>.</p>${storeLine()}</section>`

function str(v, max){ return (typeof v === 'string' ? v : (v == null ? '' : String(v))).replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, max); }
function normalizeConfig(raw){
  if (!raw || typeof raw !== 'object') throw new Error('rounds');
  let c = raw;
  if (raw.set && typeof raw.set === 'object') c = raw.set;
  else if (raw.config && typeof raw.config === 'object') c = raw.config;
  if (!Array.isArray(c.rounds)) throw new Error('rounds');
  const out = {
    version:1,
    title: str(c.title, 80) || 'Classroom Feud',
    teamA: str(c.teamA, 30) || I18N.en.teamA,
    teamB: str(c.teamB, 30) || I18N.en.teamB,
    lang: c.lang === 'vi' ? 'vi' : 'en',
    multiplier: [2,3,4,5].includes(Number(c.multiplier)) ? Number(c.multiplier) : 2,
    doubleMode: c.doubleMode === 'custom' ? 'custom' : 'auto',
    sortAnswers: c.sortAnswers !== false,
    timerSeconds: clampInt(c.timerSeconds, 3, 180, 15),
    sample: !!c.sample,
    classId: str(c.classId, 20), libSetId: str(c.libSetId, 120),
    rounds: c.rounds.slice(0, MAX_ROUNDS).filter(r => r && typeof r === 'object').map(r => {
      const list = Array.isArray(r.answers) ? r.answers : [];
      return {
        id: uid(), question: str(r.question != null ? r.question : r.q, 200), double: !!r.double,
        answers: list.slice(0, MAX_ANSWERS).map(a => {
          if (Array.isArray(a)) return { id:uid(), text:str(a[0], 80), points:str(a[1], 6).trim() };
          a = a || {};
          return { id:uid(), text:str(a.text != null ? a.text : a.answer, 80), points: a.points != null ? str(a.points, 6).trim() : '' };
        })
      };
    })
  };
  let n = 0; out.rounds.forEach(r => { if (r.double) { n++; if (n > 2) r.double = false; } });
  return out;
}
function exportableSet(c){
  return {
    title:c.title.trim(), teamA:c.teamA.trim(), teamB:c.teamB.trim(), multiplier:c.multiplier, doubleMode:c.doubleMode, sortAnswers:c.sortAnswers, timerSeconds:c.timerSeconds,
    rounds:c.rounds.map(r => ({ question:r.question.trim(), double:!!r.double, answers:r.answers.filter(a => a.text.trim() || String(a.points).trim()).map(a => ({ text:a.text.trim(), points: /^\d{1,3}$/.test(String(a.points).trim()) ? parseInt(a.points, 10) : String(a.points).trim() })) }))
  };
}
function isDoubleIdx(c, i){ const n = c.rounds.length; return c.doubleMode === 'custom' ? !!c.rounds[i].double : i >= n - 2; }
function ptsInvalid(v){ const s = String(v).trim(); return s !== '' && !/^\d{1,3}$/.test(s); }

function validateConfig(c){
  const errors = [], rounds = [];
  if (!c.rounds.length) errors.push({ msg:t('errNoRounds') });
  c.rounds.forEach((r, ri) => {
    const q = r.question.trim();
    if (!q) errors.push({ msg:t('errNoQuestion', {r:ri+1}), rid:r.id, field:'question' });
    const answers = []; let ai = 0, rowErr = false;
    r.answers.forEach(a => {
      const text = a.text.trim(), ps = String(a.points).trim();
      if (!text && !ps) return;
      ai++;
      if (!text) { rowErr = true; errors.push({ msg:t('errNoText', {r:ri+1, a:ai}), rid:r.id, aid:a.id, field:'text' }); return; }
      if (!/^\d{1,3}$/.test(ps)) { rowErr = true; errors.push({ msg:t('errPoints', {r:ri+1, a:ai, txt:text}), rid:r.id, aid:a.id, field:'points' }); return; }
      answers.push({ text, points:parseInt(ps, 10) });
    });
    if (!answers.length && !rowErr) errors.push({ msg:t('errNoAnswers', {r:ri+1}), rid:r.id, field:'answers' });
    rounds.push({ question:q, double:isDoubleIdx(c, ri), answers });
  });
  return { errors, rounds };
}

/* ================= game model ================= */
function freshRound(r){ const n = r.answers.length; return { question:r.question, double:!!r.double, answers:r.answers.map(a => ({ text:a.text, points:a.points })), revealed:Array(n).fill(false), by:Array(n).fill(null), strikes:0, steal:null, stealResult:null, stealPts:0, earned:{A:0, B:0} }; }
function newGame(meta, rounds){
  return { v:1, id:uid(), startedAt:Date.now(), title:meta.title, teamA:meta.teamA, teamB:meta.teamB, multiplier:meta.multiplier, timerSeconds:meta.timerSeconds,
    rounds:rounds.map(freshRound), index:0, turn:'A', finished:false, history:[] };
}
function validGame(g){
  try {
    if (!g || !Array.isArray(g.rounds) || !g.rounds.length) return false;
    if (!Number.isInteger(g.index) || g.index < 0 || g.index >= g.rounds.length) return false;
    if (g.turn !== 'A' && g.turn !== 'B') return false;
    if (!Array.isArray(g.history)) g.history = [];
    return g.rounds.every(r => Array.isArray(r.answers) && r.answers.length && Array.isArray(r.revealed) && r.revealed.length === r.answers.length && Array.isArray(r.by) && r.earned && typeof r.earned.A === 'number' && typeof r.earned.B === 'number');
  } catch(e){ return false; }
}
const cur = () => game.rounds[game.index];
const mult = r => r.double ? game.multiplier : 1;
const other = tm => tm === 'A' ? 'B' : 'A';
const score = tm => game ? game.rounds.reduce((s, r) => s + (r.earned[tm] || 0), 0) : 0;
const isOver = r => r.stealResult !== null || r.revealed.every(Boolean);
const stealPending = r => !!r.steal && r.stealResult === null;
function hiddenBase(r){ let s = 0; r.revealed.forEach((v, i) => { if (!v) s += r.answers[i].points; }); return s; }
function teamName(tm, g){ g = g || game; const raw = g ? (tm === 'A' ? g.teamA : g.teamB) : (tm === 'A' ? cfg.teamA : cfg.teamB); return (raw || '').trim() || t(tm === 'A' ? 'teamA' : 'teamB'); }
function gameTitle(){ return (game ? game.title : cfg.title || '').trim() || t('appName'); }

function saveGame(){
  if (!game) { store.del(KEY.game); return; }
  if (!store.set(KEY.game, game)) {
    if (game.history.length > 15) { game.history = game.history.slice(-15); store.set(KEY.game, game); }
  }
}
function push(label){
  const snap = JSON.stringify(Object.assign({}, game, { history:undefined }));
  game.history.push({ label, snap });
  if (game.history.length > MAX_HISTORY) game.history.shift();
}
function describe(l){
  switch (l.k) {
    case 'reveal': return t('uReveal', {n:l.n});
    case 'show': return t('uShow', {n:l.n});
    case 'strike': return t('uStrike');
    case 'steal': return t('uSteal');
    case 'stealTeam': return t('uStealTeam');
    case 'turn': return t('uTurn');
    case 'manual': return t('uManual');
    case 'next': return t('uNext');
    case 'reset': return t('uReset');
    case 'finish': return t('uFinish');
    default: return '';
  }
}
function commit(){ saveGame(); renderGame(); }

/* ---- actions ---- */
function setTurn(tm){
  if (!game) return;
  if (game.turn === tm) { pulsePodium(tm); return; }
  push({k:'turn'}); game.turn = tm; commit();
  Sound.fx('blip'); pulsePodium(tm); toast(t('turnTo', {team:teamName(tm)}));
}
function revealTile(i){
  if (!game || screen !== 'game') return;
  const r = cur();
  if (i < 0 || i >= r.answers.length) return;
  if (r.revealed[i]) { bumpTile(i); toast(t('toastAlready')); return; }
  if (stealPending(r)) { stealSuccess(); return; }
  if (isOver(r)) {
    push({k:'show', n:i+1}); r.revealed[i] = true; r.by[i] = null; commit(); Sound.fx('softReveal'); return;
  }
  const tm = game.turn, pts = r.answers[i].points * mult(r);
  push({k:'reveal', n:i+1});
  r.revealed[i] = true; r.by[i] = tm; r.earned[tm] += pts;
  commit();
  if (r.double) { Sound.fx('revealDouble'); flashX2(i); } else Sound.fx('reveal');
  gainChip(tm, pts);
  if (r.revealed.every(Boolean)) setTimeout(() => { Sound.fx('cleared'); toast(t('clearedToast')); }, 750);
}
function revealNext(){
  if (!game) return;
  const r = cur();
  if (stealPending(r)) { toast(t('toastStealFirst')); return; }
  const i = r.revealed.indexOf(false);
  if (i < 0) { toast(t('nothingHidden')); return; }
  if (!guard('revealNext', 250)) return;
  push({k:'show', n:i+1}); r.revealed[i] = true; r.by[i] = null; commit();
  Sound.fx('softReveal'); toast(t('toastShown', {n:i+1}));
}
function strike(){
  if (!game) return;
  const r = cur();
  if (stealPending(r)) { toast(t('toastMaxStrikes')); return; }
  if (isOver(r)) { toast(t('toastNoStrike')); return; }
  if (r.strikes >= 3) return;
  if (!guard('strike', 450)) return;
  push({k:'strike'});
  r.strikes++;
  if (r.strikes === 3) r.steal = other(game.turn);
  commit();
  showStrikeFx(r.strikes); Sound.fx('strike');
  if (r.strikes === 3) setTimeout(() => Sound.fx('stealAlert'), 800);
}
function stealSuccess(){
  const r = cur();
  if (!stealPending(r)) return;
  const tm = r.steal, m = mult(r);
  const hidden = []; r.revealed.forEach((v, i) => { if (!v) hidden.push(i); });
  const pts = hidden.reduce((s, i) => s + r.answers[i].points * m, 0);
  push({k:'steal'});
  hidden.forEach(i => { r.revealed[i] = true; r.by[i] = tm; });
  r.earned[tm] += pts; r.stealResult = 'success'; r.stealPts = pts;
  commit();
  Sound.fx('steal'); gainChip(tm, pts); toast(t('stealToast', {team:teamName(tm), n:pts}));
  const pod = $(tm === 'A' ? '#podA' : '#podB').getBoundingClientRect();
  Confetti.burst(pod.left + pod.width / 2, pod.top + pod.height / 2, 90);
  if (r.double) hidden.forEach((i, k) => setTimeout(() => flashX2(i), k * 140));
}
function stealFail(){
  const r = cur();
  if (!stealPending(r)) return;
  push({k:'steal'}); r.stealResult = 'fail'; r.stealPts = 0; commit();
  Sound.fx('buzzer');
}
function swapSteal(){
  const r = cur();
  if (!stealPending(r)) return;
  push({k:'stealTeam'}); r.steal = other(r.steal); commit(); Sound.fx('blip');
}
function manualPoints(tm, sign){
  const r = cur(), raw = $('#mpBase').value.trim();
  const err = $('#mpErr');
  if (!/^\d{1,3}$/.test(raw) || parseInt(raw, 10) < 1) { err.textContent = t('mpInvalid'); err.hidden = false; $('#mpBase').classList.add('invalid'); return; }
  err.hidden = true; $('#mpBase').classList.remove('invalid');
  if (!guard('manual', 300)) return;
  let pts = parseInt(raw, 10) * mult(r);
  if (sign < 0) pts = Math.min(pts, score(tm));
  if (pts <= 0) { toast(t('mpZero', {team:teamName(tm)})); return; }
  push({k:'manual'}); r.earned[tm] += sign * pts; commit();
  Sound.fx(sign > 0 ? 'coin' : 'blip'); gainChip(tm, sign * pts);
}
function nextRound(){
  if (!game) return;
  if (!guard('nav', 700)) return;
  if (game.index < game.rounds.length - 1) {
    push({k:'next'}); game.index++; stopTimer(); closePops(); commit(); introRound();
  } else finishGame();
}
function finishGame(){
  push({k:'finish'}); game.finished = true; stopTimer(); saveGame();
  setScreen('results'); celebrate();
}
async function resetRound(){
  const r = cur();
  const ok = await confirmBox({ title:t('rrTitle'), text:t('rrText', {a:teamName('A'), b:teamName('B'), pa:r.earned.A, pb:r.earned.B}), ok:t('rrOK'), danger:true });
  if (!ok) return;
  push({k:'reset'});
  game.rounds[game.index] = freshRound(r);
  stopTimer(); commit(); Sound.fx('softReveal'); toast(t('toastReset'));
}
function undo(){
  if (!game) return;
  if (!game.history.length) { toast(t('nothingUndo')); return; }
  if (!guard('undo', 150)) return;
  const h = game.history.pop();
  let prev;
  try { prev = JSON.parse(h.snap); } catch(e){ return; }
  prev.history = game.history;
  game = prev;
  stopTimer();
  saveGame();
  if (screen !== 'game') setScreen('game'); else renderGame();
  Sound.fx('blip'); toast(t('undone', {what:describe(h.label)}));
}
async function restartGame(needConfirm){
  if (!game) return;
  if (needConfirm) { const ok = await confirmBox({ title:t('rsQ'), text:t('rsText'), ok:t('rsOK'), danger:true }); if (!ok) return; }
  const rounds = game.rounds.map(r => ({ question:r.question, double:r.double, answers:r.answers }));
  game = newGame({ title:game.title, teamA:game.teamA, teamB:game.teamB, multiplier:game.multiplier, timerSeconds:game.timerSeconds }, rounds);
  saveGame(); setScreen('game'); countdown(introRound);
}
async function startGame(){
  const v = validateConfig(cfg);
  if (v.errors.length) { showErrors = true; renderSetup(); showErrorList(v.errors); return; }
  if (game && !game.finished) {

const shown = { A:null, B:null }, scoreAnim = { A:0, B:0 };
function animateScore(tm, target){
  const el = $('#score' + tm);
  if (shown[tm] === null || reduceMotion) { shown[tm] = target; el.textContent = target; return; }
  if (shown[tm] === target && !scoreAnim[tm]) return;
  const from = shown[tm], start = performance.now(), dur = Math.min(1100, 380 + Math.abs(target - from) * 5);
  cancelAnimationFrame(scoreAnim[tm]);
  if (target > from) { el.classList.remove('popped'); void el.offsetWidth; el.classList.add('popped'); }
  const step = now => {
    const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
    const v = Math.round(from + (target - from) * e);
    shown[tm] = v; el.textContent = v;
    if (p < 1) scoreAnim[tm] = requestAnimationFrame(step); else { scoreAnim[tm] = 0; shown[tm] = target; el.textContent = target; }
  };
  scoreAnim[tm] = requestAnimationFrame(step);
}

function countdown(then){

const Timer = { running:false, end:0, total:0, raf:0, last:-1, hideT:0 };
function toggleTimer(){ if (Timer.running) { stopTimer(); return; } startTimer(); }
function startTimer(){
  if (!game) return;
  Timer.total = game.timerSeconds || 15; Timer.end = performance.now() + Timer.total * 1000; Timer.running = true; Timer.last = -1;
  clearTimeout(Timer.hideT); const el = $('#timer'); el.hidden = false; el.classList.remove('done', 'low');
  tickTimer();
}
function stopTimer(){ Timer.running = false; cancelAnimationFrame(Timer.raf); clearTimeout(Timer.hideT); const el = $('#timer'); if (el) { el.hidden = true; el.classList.remove('done', 'low'); } }
function tickTimer(){
  if (!Timer.running) return;
  const left = Math.max(0, Timer.end - performance.now()), sec = Math.ceil(left / 1000);
  if (sec !== Timer.last) { Timer.last = sec; if (sec > 0) Sound.fx(sec <= 3 ? 'tickHi' : 'tick'); }
  const el = $('#timer'); el.classList.toggle('low', sec <= 3);
  $('#timerNum').textContent = sec;
  $('#timerArc').setAttribute('stroke-dashoffset', (119.38 * (1 - left / (Timer.total * 1000))).toFixed(2));
  if (left <= 0) {
    Timer.running = false; el.classList.add('done'); Sound.fx('buzzer');
    const tu = $('#timeUp'); tu.textContent = t('timeUp'); tu.hidden = false; setTimeout(() => { tu.hidden = true; }, 1600);
    Timer.hideT = setTimeout(() => { el.hidden = true; el.classList.remove('done', 'low'); }, 2600);
    return;
  }
  Timer.raf = requestAnimationFrame(tickTimer);
}

    return;
  }
  const f = el.dataset.field; if (!f) return;

  else {

function onSetupChange(e){

    r.double = el.checked; markEdited(); saveCfgNow(); renderSetup(); refocus(`#dbl-${r.id}`); return;
  }
  if (el.id === 'cfgClass') { cfg.classId = el.value; saveCfgNow(); const c = currentClass(); if (c) setGsPrefs({ id:gsPrefs().id, level:c.level }); renderSetup(); refocus('#cfgClass'); return; }
  if (el.id === 'gsLevel') { setGsPrefs({ id:gsPrefs().id, level:LEVELS.includes(el.value) ? el.value : '' }); renderGsCard(); return; }
  const k = el.dataset.cfg; if (!k) return;
  if (k === 'lang') { setLang(el.value); return; }
  if (k === 'multiplier') cfg.multiplier = clampInt(el.value, 2, 5, 2);

  else if (k === 'sortAnswers') cfg.sortAnswers = el.checked;
  else if (k === 'timerSeconds') { cfg.timerSeconds = clampInt(el.value, 3, 180, 15); el.value = cfg.timerSeconds; }

function onSetupKey(e){

async function deleteRound(r){

/* ================= modal, toast, popovers ================= */
const Modal = {
  onDismiss:null, actions:[], lastFocus:null,
  open(o){
    this.lastFocus = document.activeElement;
    const root = $('#modalRoot');
    this.actions = o.actions || []; this.onDismiss = o.onDismiss || null;
    root.innerHTML = `<div class="modal ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="modal-head"><h2 id="mTitle">${esc(o.title)}</h2><button type="button" class="icon-btn sm" data-mclose aria-label="${esc(t('close'))}">${ICON.x}</button></div>
      <div class="modal-body" id="mBody">${o.body || ''}</div>
      <div class="modal-foot">${this.actions.map((a, i) => `<button type="button" class="btn ${a.kind === 'gold' ? 'btn-gold' : a.kind === 'danger' ? 'btn-danger' : a.kind === 'ok' ? 'btn-ok' : ''}" data-mact="${i}" ${a.id ? `id="${a.id}"` : ''}>${a.icon ? ICON[a.icon] : ''}<span>${esc(a.label)}</span></button>`).join('')}</div></div>`;
    root.hidden = false;
    closePops();
    const focusEl = $(o.focus || '[data-mact]:last-child', root) || $('[data-mclose]', root);
    if (focusEl) focusEl.focus();
    if (o.onOpen) o.onOpen($('#mBody'));
  },
  close(dismissed){
    const root = $('#modalRoot'); if (root.hidden) return;
    root.hidden = true; root.innerHTML = '';
    const d = this.onDismiss; this.onDismiss = null;
    if (dismissed && d) d();
    if (this.lastFocus && this.lastFocus.focus && document.contains(this.lastFocus)) { try { this.lastFocus.focus({preventScroll:true}); } catch(e){} }
  },
  isOpen(){ return !$('#modalRoot').hidden; }
};
$('#modalRoot').addEventListener('click', e => {
  if (e.target.id === 'modalRoot' || e.target.closest('[data-mclose]')) { Modal.close(true); return; }
  const b = e.target.closest('[data-mact]');
  if (b) { const a = Modal.actions[+b.dataset.mact]; if (!a) return; if (a.close) Modal.close(true); if (a.onClick) a.onClick(e); }
});
function confirmBox(o){
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    Modal.open({ title:o.title, body:`<p>${esc(o.text)}</p>`, onDismiss:() => fin(false),
      actions:[{ label:t('cancel'), onClick:() => { Modal.close(false); fin(false); } }, { label:o.ok, kind:o.danger ? 'danger' : 'gold', onClick:() => { Modal.close(false); fin(true); } }],
      focus:'[data-mact="0"]' });
  });
}
let toastT = 0;
function toast(msg, kind){ const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (kind ? ' ' + kind : ''); clearTimeout(toastT); toastT = setTimeout(() => { el.className = 'toast'; }, 2800); }
function closePops(){ const s = $('#soundPop'); if (s && !s.hidden) closeSoundPanel(); const p = $('#pointsPop'); if (p && !p.hidden) togglePoints(false); }
function releaseFocus(pop, trigger){

}

function cleanRound(r){
  if (!r || typeof r !== 'object') return null;

  return question && answers.length ? { question, answers } : null;
}
function cleanSet(s){
  if (!s || typeof s !== 'object' || !LEVELS.includes(s.level) || !Array.isArray(s.rounds)) return null;
  const topic = str(s.topic, 80).trim(); if (!topic) return null;
  const now = Date.now();
  return { id:str(s.id, 20) || uid(), level:s.level, topic, rounds:s.rounds.map(cleanRound).filter(Boolean), importedAt:Number(s.importedAt) || now, updatedAt:Number(s.updatedAt) || now };
}

function getClasses(){

function saveClasses(list){ if (store.set(KEY.classes, list)) return true; toast(store.ok ? t('ssFull') : t('ssNoStore'), 'bad'); return false; }
function sortSets(a, b){ return LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level) || a.topic.localeCompare(b.topic); }
/* merge rounds into the set with the same level + topic (EXCEL-FORMAT.md): same question → replaced, new question → appended */
function mergeSet(lib, level, topic, rounds, now){
  let s = lib.find(x => x.level === level && qKey(x.topic) === qKey(topic)), isNew = false, added = 0, replaced = 0;
  if (!s) { s = { id:uid(), level, topic:topic.trim(), rounds:[], importedAt:now, updatedAt:now }; lib.push(s); isNew = true; }
  rounds.forEach(r => {
    const i = s.rounds.findIndex(x => qKey(x.question) === qKey(r.question));
    if (i >= 0) { s.rounds[i] = r; replaced++; } else { s.rounds.push(r); added++; }
  });
  s.updatedAt = now;
  return { set:s, isNew, added, replaced };
}

}

/* ---- Excel import (format: EXCEL-FORMAT.md) ---- */
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const APPROVED = ['y', 'yes', 'x', '✓', '✔', 'ok', 'có', 'co', 'duyệt', '1', 'true'];
let xlsxLoading = null;
function loadXLSX(){
  if (window.XLSX && window.XLSX.read) return Promise.resolve(window.XLSX);
  if (xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = XLSX_URL; s.async = true; s.crossOrigin = 'anonymous';
    const fail = () => { xlsxLoading = null; s.remove(); rej(new Error('offline')); };
    const to = setTimeout(fail, 20000);
    s.onload = () => { clearTimeout(to); if (window.XLSX && window.XLSX.read) res(window.XLSX); else fail(); };
    s.onerror = () => { clearTimeout(to); fail(); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}
function openExcelImport(){
  Modal.open({ title:t('xlTitle'), body:`<p class="muted">${esc(t('xlText'))}</p>
    <div class="field"><label for="xlFile">${esc(t('xlFile'))}</label><input type="file" id="xlFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div>
    <p class="xl-status" id="xlStatus" role="status" hidden></p>
    <p class="mp-err" id="xlErr" role="alert" hidden></p>`,
    actions:[{ label:t('cancel'), close:true }], focus:'#xlFile',
    onOpen:() => { $('#xlFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importExcelFile(f); }); } });
}
async function importExcelFile(file){
  const st = $('#xlStatus'), er = $('#xlErr'), inp = $('#xlFile');
  const fail = m => { if (st) st.hidden = true; if (er) { er.textContent = m; er.hidden = false; } if (inp) { inp.disabled = false; inp.value = ''; } };
  if (er) er.hidden = true;
  if (st) { st.textContent = t('xlLoading'); st.hidden = false; }
  if (inp) inp.disabled = true;
  let X, buf;
  try { X = await loadXLSX(); } catch(e){ fail(t('xlOffline')); return; }
  try { buf = await file.arrayBuffer(); } catch(e){ fail(t('xlBadFile')); return; }
  let wb; try { wb = X.read(new Uint8Array(buf), { type:'array' }); } catch(e){ fail(t('xlBadFile')); return; }
  const parsed = parseWorkbook(X, wb);
  if (!parsed.sheets) { fail(t('xlNoSheets')); return; }
  const lib = getLibrary(), now = Date.now(), touched = [];
  let added = 0, replaced = 0;
  parsed.groups.forEach(g => {
    const m = mergeSet(lib, g.level, g.topic, g.rounds, now);
    added += m.added; replaced += m.replaced;
    const prev = touched.find(x => x.set === m.set);
    if (!prev) touched.push({ set:m.set, isNew:m.isNew });
  });
  if (touched.length && !saveLibrary(lib)) { fail(store.ok ? t('ssFull') : t('ssNoStore')); return; }
  renderSetup();
  showExcelSummary(file.name, parsed, touched, added, replaced);
}
/* question + answer/points cells → { probs, answers } (shared by Excel import and the Google Sheet bank); get(k) returns [text, rawPoints] */
function checkQA(question, n, get){
  const probs = [], answers = [];
  if (!question) probs.push(t('xeQuestion')); else if (question.length > 200) probs.push(t('xeQLong'));
  for (let k = 0; k < n; k++) {
    const [text, raw] = get(k), ps = String(raw == null ? '' : raw).trim();
    if (!text && ps === '') continue;
    if (!text) { probs.push(t('xePtsNoAns', {a:k + 1})); continue; }
    if (text.length > 80) { probs.push(t('xeALong', {a:k + 1})); continue; }
    if (ps === '') { probs.push(t('xeAnsNoPts', {a:k + 1})); continue; }
    const v = typeof raw === 'number' ? raw : (/^\d{1,3}(?:\.0+)?$/.test(ps) ? parseInt(ps, 10) : NaN);
    if (!Number.isInteger(v) || v < 0 || v > 999) { probs.push(t('xePts', {a:k + 1, v:ps})); continue; }
    answers.push({ text, points:v });
  }
  if (question && !answers.length && !probs.length) probs.push(t('xeNoAns'));
  return { probs, answers };
}
function cellVal(X, ws, r, c){ const cell = ws[X.utils.encode_cell({ r, c })]; if (!cell || cell.v == null) return ''; return cell.v; }
function parseWorkbook(X, wb){

    if (!LEVELS.includes(lv)) return;

    const ws = wb.Sheets[name]; if (!ws || !ws['!ref']) return;
    const range = X.utils.decode_range(ws['!ref']);
    for (let r = 1; r <= range.e.r; r++) {
      const v = c => cellVal(X, ws, r, c), s = c => String(v(c)).replace(/[\u0000-\u001f\u007f]/g, ' ').trim();

/* CSV (RFC 4180): quoted fields, "" escapes, commas and line breaks inside quotes, BOM, CRLF */
function parseCSV(text){

    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }

    roundIntro(){ const t0 = now(); noise(t0, 0.35, {type:'bandpass', f:400, fTo:3000, gain:0.07, attack:0.2}); brass(392, t0 + 0.3, 0.22, 0.06); brass(523.25, t0 + 0.44, 0.4, 0.06); brass(659.25, t0 + 0.44, 0.4, 0.045); },

    coin(){ const t0 = now(); tone('square', 987.77, t0, 0.08, {gain:0.06, lp:4000}); tone('square', 1318.5, t0 + 0.08, 0.3, {gain:0.06, lp:4000}); },
    blip(){ const t0 = now(); tone('sine', 660, t0, 0.08, {gain:0.12}); tone('sine', 990, t0 + 0.05, 0.08, {gain:0.08}); },
    fanfare(){ const t0 = now() + 0.05, b = 0.16;
      [[392,0,1],[392,1,1],[392,2,1],[523.25,3,3],[392,6,1],[523.25,7,1],[659.25,8,4],[587.33,12,1],[659.25,13,1],[783.99,14,7]].forEach(([f, s, l]) => brass(f, t0 + s * b, l * b * 0.95, 0.075));

})();
function updateSoundUI(){

/* ================= confetti ================= */
const Confetti = (() => {
  const cv = $('#confetti'), cx = cv.getContext('2d');
  const COLORS = ['#ffc83d', '#ffe79a', '#3cd3ff', '#ff63d4', '#ffffff', '#8be9ff'];
  let parts = [], raf = 0, rainUntil = 0, dpr = 1, W = 0, H = 0;
  function size(){ dpr = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
  function spawn(x, y, vx, vy){ if (parts.length > 700) return; parts.push({ x, y, vx, vy, rot:Math.random() * 6, vr:(Math.random() - 0.5) * 0.3, w:6 + Math.random() * 7, h:9 + Math.random() * 10, c:COLORS[Math.random() * COLORS.length | 0], life:0 }); }
  function loop(){
    if (raf) return;
    const tick = () => {
      const n = performance.now();
      if (n < rainUntil) for (let i = 0; i < (W < 700 ? 2 : 4); i++) spawn(Math.random() * W, -20, (Math.random() - 0.5) * 3, Math.random() * 2 + 2);
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
      parts = parts.filter(p => p.y < H + 40 && p.life < 700);
      for (const p of parts) {
        p.vy = Math.min(p.vy + 0.22, 7); p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * 0.1)) + 1); cx.restore();
      }
      if (parts.length || n < rainUntil) raf = requestAnimationFrame(tick); else { raf = 0; cx.clearRect(0, 0, W, H); }
    };
    raf = requestAnimationFrame(tick);
  }
  return {
    burst(x, y, n){ if (reduceMotion) return; size(); for (let i = 0; i < (n || 80); i++) spawn(x, y, (Math.random() - 0.5) * 16, -Math.random() * 13 - 4); loop(); },
    rain(ms){ if (reduceMotion) return; size(); rainUntil = performance.now() + ms; const n0 = Math.round(Math.min(120, W / 9)); for (let i = 0; i < n0; i++) spawn(Math.random() * W, H * 0.35, (Math.random() - 0.5) * 18, -Math.random() * 14 - 4); loop(); },
    clear(){ parts = []; rainUntil = 0; if (raf) { cancelAnimationFrame(raf); raf = 0; } cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); }
  };
})();

/* ================= events ================= */
document.addEventListener('pointerdown', () => Sound.unlock(), { capture:true });
document.addEventListener('keydown', () => Sound.unlock(), { capture:true });

document.addEventListener('click', e => {
  const sp = $('#soundPop');
  if (!sp.hidden && !e.target.closest('#soundPop') && !e.target.closest('#btnSound')) closeSoundPanel();
  const pp = $('#pointsPop');
  if (!pp.hidden && !e.target.closest('#pointsPop') && !e.target.closest('#cbPoints')) togglePoints(false);
  const tile = e.target.closest('#board .tile[data-i]');
  if (tile) { revealTile(+tile.dataset.i); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const a = b.dataset.act;
  switch (a) {
    case 'lang': setLang(b.dataset.lang); break;
    case 'help': openHelp(); break;
    case 'soundPanel': toggleSoundPanel(); break;
    case 'closeSound': toggleSoundPanel(); break;
    case 'soundOn': Sound.setMuted(false); updateSoundUI(); Sound.fx('blip'); break;
    case 'muteAll': Sound.setMuted(true); updateSoundUI(); break;
    case 'testSound': if (Sound.st.muted) { Sound.setMuted(false); updateSoundUI(); } Sound.fx('reveal'); break;
    case 'fullscreen': toggleFullscreen(); break;
    case 'restart': restartGame(true); break;
    case 'toSetup': setScreen('setup'); break;
    case 'resume': if (game && !game.finished) setScreen('game'); break;
    case 'seeResults': if (game && game.finished) setScreen('results'); break;
    case 'start': startGame(); break;
    case 'preview': openPreview(); break;
    case 'savedSets': openSavedSets(); break;
    case 'import': openImport(); break;
    case 'export': openExport(); break;
    case 'resetAll': resetAll(); break;
    case 'addRound': addRound(); break;
    case 'addAnswer': addAnswer(findRound(b)); break;
    case 'deleteRound': deleteRound(findRound(b)); break;
    case 'moveUp': moveRound(findRound(b), -1); break;
    case 'moveDown': moveRound(findRound(b), 1); break;
    case 'deleteAnswer': {
      const r = findRound(b), row = b.closest('[data-aid]'); if (!r || !row) break;
      const i = r.answers.findIndex(x => x.id === row.dataset.aid); if (i < 0) break;
      r.answers.splice(i, 1); markEdited(); saveCfgNow(); renderSetup();
      const nx = r.answers[Math.min(i, r.answers.length - 1)];
      refocus(nx ? `[data-aid="${nx.id}"] [data-act="deleteAnswer"]` : `[data-rid="${r.id}"] [data-act="addAnswer"]`);
      break;
    }
    case 'gotoErr': gotoErr(+b.dataset.ei); break;
    case 'ssLoad': loadSet(b.dataset.sid); break;
    case 'ssDelete': deleteSet(b.dataset.sid); break;
    case 'library': openLibrary(); break;
    case 'excel': openExcelImport(); break;
    case 'classes': openClasses(); break;
    case 'useSet': useLibrarySet(b.dataset.id); break;
    case 'lbView': viewLibrarySet(b.dataset.id); break;
    case 'lbDelete': deleteLibrarySet(b.dataset.id); break;
    case 'cmEdit': editClass(b.dataset.id); break;
    case 'cmDelete': deleteClass(b.dataset.id); break;
    case 'gsRefresh': gsRefresh(false); break;
    case 'gsLink': openSheetLink(); break;
    case 'gsUse': gsUseSet(b.dataset.id); break;
    case 'gsView': gsViewSet(b.dataset.id); break;
    case 'gsProblems': gsShowProblems(); break;
    case 'turnA': setTurn('A'); break;
    case 'turnB': setTurn('B'); break;
    case 'reveal': revealNext(); break;
    case 'strike': strike(); break;
    case 'timer': toggleTimer(); break;
    case 'points': togglePoints(); break;
    case 'closePoints': togglePoints(false); break;
    case 'mpAddA': manualPoints('A', 1); break;
    case 'mpAddB': manualPoints('B', 1); break;
    case 'mpSubA': manualPoints('A', -1); break;
    case 'mpSubB': manualPoints('B', -1); break;
    case 'undo': undo(); break;
    case 'resetRound': resetRound(); break;
    case 'next': nextRound(); break;
    case 'stealOK': stealSuccess(); break;
    case 'stealFail': stealFail(); break;
    case 'swapSteal': swapSteal(); break;
    case 'hideControls': $('#screen-game').classList.add('clean'); $('#showCtl').hidden = false; closePops(); break;
    case 'showControls': $('#screen-game').classList.remove('clean'); $('#showCtl').hidden = true; break;
    case 'playAgain': restartGame(false); break;
    case 'backBoard': if (game) { game.finished = false; saveGame(); Confetti.clear(); setScreen('game'); } break;
    case 'exportResults': openResultsExport(); break;
  }
});
const setupBody = $('#setupBody');
setupBody.addEventListener('input', onSetupInput);
setupBody.addEventListener('change', onSetupChange);

$('#mpBase').addEventListener('input', () => { $('#mpErr').hidden = true; $('#mpBase').classList.remove('invalid'); updateManualPanel(); });
$('#mpBase').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); manualPoints(game ? game.turn : 'A', 1); } });
$('#spMusic').addEventListener('change', e => { if (e.target.checked && Sound.st.muted) Sound.setMuted(false); Sound.setMusicOn(e.target.checked); updateSoundUI(); });
$('#spMusicVol').addEventListener('input', e => { Sound.setMusic(+e.target.value / 100); $('#spMusicVal').textContent = e.target.value + '%'; });

document.addEventListener('fullscreenchange', updateFsIcon);
document.addEventListener('webkitfullscreenchange', updateFsIcon);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && screen === 'game') keepAwake(true); });
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (screen === 'game' && game) renderBoard(); }, 120); });
if (window.ResizeObserver) { let lastCols = 0; new ResizeObserver(() => { if (screen !== 'game' || !game) return; const c = boardCols(cur().answers.length); if (c !== lastCols) { lastCols = c; renderBoard(); } }).observe($('#board')); }

document.addEventListener('keydown', e => {
  if (cdState) { if (!e.repeat) { e.preventDefault(); cdState.finish(); } return; }
  if (e.key === 'Escape') {
    if (Modal.isOpen()) { e.preventDefault(); Modal.close(true); return; }
    if (anyPopOpen()) { e.preventDefault(); closePops(); return; }
    return;
  }
  const tg = e.target, typing = tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
  if (typing || Modal.isOpen() || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z' && screen === 'game') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey) return;
  if (k === 'f') { e.preventDefault(); toggleFullscreen(); return; }
  if (k === 'm') { e.preventDefault(); toggleMute(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  if (screen !== 'game' || !game) return;
  if (/^[0-9]$/.test(k)) { e.preventDefault(); const i = k === '0' ? 9 : parseInt(k, 10) - 1; revealTile(i); return; }
  const map = { a:() => setTurn('A'), b:() => setTurn('B'), x:strike, r:revealNext, t:toggleTimer, u:undo, n:nextRound,
    h:() => { const g = $('#screen-game'); const c = !g.classList.contains('clean'); g.classList.toggle('clean', c); $('#showCtl').hidden = !c; if (c) closePops(); } };
  if (map[k]) { e.preventDefault(); map[k](); }
});

/* ================= boot ================= */
function boot(hot){
  store.init();
  let c = null;
  try { c = hot && hot.cfg ? normalizeConfig(hot.cfg) : (store.get(KEY.config) ? normalizeConfig(store.get(KEY.config)) : null); } catch(e){ c = null; }
  if (c) { const raw = (hot && hot.cfg) || store.get(KEY.config); c.sample = !!(raw && raw.sample); }
  cfg = c || sampleConfig('en');
  LANG = cfg.lang;
  const g = hot && hot.game ? hot.game : store.get(KEY.game);
  game = validGame(g) ? g : null;
  $$('[data-ico]').forEach(el => { el.outerHTML = ICON[el.dataset.ico] || ''; });
  applyStatic();
  const want = (hot && hot.screen) || store.get(KEY.screen);
  if (want === 'game' && game && !game.finished) setScreen('game');
  else if (want === 'results' && game && game.finished) setScreen('results');
  else setScreen('setup');
  if (!store.get(KEY.config)) saveCfgNow();
  gsRefresh(true);
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ cfg, game, screen })); } catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
